# Sistem nginx'i için: /etc/nginx/sites-available/ek-2 olarak kopyalanır. ESKİ adres (2026-10-30'dan beri yönlendirme).
# Yeni adres: sistem-nginx-form-ek-2.conf. Sertifika: certbot --nginx -d ek-2.selimkilic.com.tr
# EK-2 mobil belge yükleme (Laravel, /root/ek-2/ek2-system, Docker ek2-nginx 127.0.0.1:8096)
server {
    server_name ek-2.selimkilic.com.tr;

    # 2 telefon fotoğrafı × en fazla 10 MB
    client_max_body_size 25m;

    # 2026-10-30: yeni adres form.ek-2.com.tr. Sayfa istekleri (GET/HEAD) kalıcı yönlenir; o an gönderilen form (POST)
    # burada tamamlanır, yarım yükleme kaybolmaz. Eski adres en az 2-3 ay böyle kalır.
    location / {
        if ($request_method ~ ^(GET|HEAD)$) { return 301 https://form.ek-2.com.tr$request_uri; }
        proxy_pass http://127.0.0.1:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ek-2.selimkilic.com.tr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ek-2.selimkilic.com.tr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = ek-2.selimkilic.com.tr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name ek-2.selimkilic.com.tr;
    return 404; # managed by Certbot


}