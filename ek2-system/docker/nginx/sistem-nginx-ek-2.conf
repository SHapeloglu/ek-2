# Sistem nginx'i için: /etc/nginx/sites-available/ek-2 olarak kopyalanır. Sertifika: certbot --nginx -d ek-2.selimkilic.com.tr
# EK-2 mobil belge yükleme (Laravel, /root/ek-2/ek2-system, Docker ek2-nginx 127.0.0.1:8096)
server {
    listen 80;
    server_name ek-2.selimkilic.com.tr;

    # 2 telefon fotoğrafı × en fazla 10 MB
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 120s;
    }
}
