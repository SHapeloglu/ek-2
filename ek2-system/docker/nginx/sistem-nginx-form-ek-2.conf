# Sistem nginx'i için: sunucuda /etc/nginx/sites-available/ek-2-com-tr-https dosyasındaki form.ek-2.com.tr bloğu.
# Sertifika ek-2.com.tr ortak sertifikası (certbot certonly --webroot -w /var/www/letsencrypt --cert-name ek-2.com.tr ... -d form.ek-2.com.tr --expand);
# 80 numaralı port ve ACME doğrulaması ek-2-com-tr-http dosyasında.
# EK-2 belge sistemi (doktor formu yükler): Laravel, Docker ek2-nginx 127.0.0.1:8096. Eski adres: ek-2.selimkilic.com.tr (2026-10-30).
# Uygulama adresleri isteğin alan adından üretir (forceRootUrl yok, trustProxies 127.0.0.1 + 172.16/12): APP_URL değişmeden çalışır.
server {
    listen 443 ssl;
    server_name form.ek-2.com.tr;
    client_max_body_size 25m;          # 2 telefon fotoğrafı × en fazla 10 MB
    add_header X-Robots-Tag "noindex, nofollow" always;
    location / {
        proxy_pass http://127.0.0.1:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 120s;
    }
    ssl_certificate /etc/letsencrypt/live/ek-2.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ek-2.com.tr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
