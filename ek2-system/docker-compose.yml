# EK-2 — sistem nginx (TLS, ek-2.selimkilic.com.tr) → 127.0.0.1:8096 → ek2-nginx → ek2-app (php-fpm)
# Veritabanı: ortak MySQL (/opt/mysql-ortak, ağ "ortak-db"). Kod imajın içinde; güncelleme = docker compose up -d --build
services:
  ek2-app:
    build: .
    container_name: ek2-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - ek2_storage:/var/www/html/storage
      - ${BELGE_HOST_DIZINI:-/srv/ek2/belgeler}:/var/www/html/storage/app/private/ek2
      - ${OCR_AKTARIM_HOST:-./ocr_aktarim}:/var/www/html/storage/ocr_aktarim
    networks: [ek2-net, ortak-db]
    mem_limit: 384m

  ek2-nginx:
    image: nginx:alpine
    container_name: ek2-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8096:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [ek2-app]
    networks: [ek2-net]
    mem_limit: 64m

volumes:
  ek2_storage:

networks:
  ek2-net:
  ortak-db:
    external: true
